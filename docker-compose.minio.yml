version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: pm_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 6

  mc-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      # wait for minio to be ready
      until wget -qO- http://minio:9000/minio/health/live >/dev/null 2>&1; do sleep 1; done
      mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      mc mb --ignore-existing myminio/${MINIO_BUCKET}
      mc policy set public myminio/${MINIO_BUCKET} || true
      echo "MinIO bucket '${MINIO_BUCKET}' ready"

volumes:
  minio_data:
